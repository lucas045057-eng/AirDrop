worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    limit_req_status 429;

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/airdrop-tls/server.crt;
        ssl_certificate_key /etc/airdrop-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 10m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        set $frontend_upstream frontend:8080;

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Health probe remains inside this container; this port is never published.
    server {
        listen 127.0.0.1:8081;
        set $frontend_upstream frontend:8080;
        location = /api/health { proxy_pass http://$frontend_upstream; }
        location / { return 404; }
    }
}
