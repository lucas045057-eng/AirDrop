server {
 listen 8080;
 server_name _;
 client_max_body_size 10m;
 # Docker service addresses can change after backend recreation.
 resolver 127.0.0.11 valid=5s ipv6=off;
 set $backend_upstream backend:8000;
 location /api/ { proxy_pass http://$backend_upstream; proxy_set_header Host $host; }
 location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
